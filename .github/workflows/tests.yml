# Autograder for Recitation 2.
#
# Runs on pull requests and on any branch except main. That is deliberate:
# the pull request is the submission, so the PR is where the green check
# belongs. Skipping main also keeps the template repo from showing a
# permanent red X — its starting state is deliberately failing tests.
name: tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the exercises
        run: ./mvnw -B test
